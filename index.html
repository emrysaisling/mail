<title>Opening Mail</title>
<style>
  :root {
    --paper: #f3efe6;
    --ink: #1c1b19;
    --muted: #8a8478;
    --seal: #b8432f;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --paper: #151412;
      --ink: #e9e4d8;
      --muted: #7d776c;
      --seal: #c9553f;
    }
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--paper);
    color: var(--ink);
    font-family: ui-serif, "New York", Georgia, serif;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 16px;
    -webkit-font-smoothing: antialiased;
  }
  main { text-align: center; max-width: 26rem; }
  svg { width: min(180px, 46vw); height: auto; display: block; margin: 0 auto 2.2rem; overflow: visible; }
  .ink { fill: var(--ink); }
  .trace {
    fill: none;
    stroke: #fff;
    stroke-width: 26;
    stroke-linecap: round;
    stroke-dasharray: 415;
    stroke-dashoffset: 415;
    animation: draw 1.5s cubic-bezier(.6, 0, .3, 1) forwards;
  }
  .seal {
    fill: var(--seal);
    opacity: 0;
    animation: appear .5s ease 1.4s forwards;
  }
  @keyframes draw { to { stroke-dashoffset: 0; } }
  @keyframes appear { to { opacity: 1; } }
  h1 {
    font-weight: 400;
    font-size: 1.05rem;
    letter-spacing: .32em;
    text-transform: uppercase;
    margin: 0 0 .9rem;
    padding-left: .32em; /* balance trailing letter-spacing */
  }
  p {
    margin: 0;
    color: var(--muted);
    font-style: italic;
    font-size: .95rem;
    line-height: 1.5;
    min-height: 1.5em;
  }
  a { color: inherit; text-underline-offset: 3px; text-decoration-thickness: 1px; }
  a:hover { color: var(--ink); }
  @media (prefers-reduced-motion: reduce) {
    .trace { animation: none; stroke-dashoffset: 0; }
    .seal { animation: none; opacity: 1; }
  }
</style>

<script>
// The message ID travels after the "#", which browsers never send to the server.
(function () {
  var title = document.getElementById('title');
  var note = document.getElementById('note');
  var raw = location.hash.slice(1);
  if (!raw) {
    title.textContent = 'Nothing to open';
    note.textContent = 'This link carries no message.';
    return;
  }
  var id;
  try { id = decodeURIComponent(raw); } catch (e) { id = raw; }
  id = id.replace(/^</, '').replace(/>$/, '');
  // Same encoding as the AppleScript side (URL path rules), so links match the format Mail accepts
  var enc = encodeURIComponent('<' + id + '>').replace(/%(21|24|26|27|28|29|2A|2B|2C|3A|3B|3D|40|2F)/gi,
    function (m) { return decodeURIComponent(m); });
  var url = 'message://' + enc;

  location.replace(url);

  // Once the hand-off has had a moment, turn the page into a quiet leftover with a manual fallback.
  setTimeout(function () {
    title.textContent = 'Sent to Mail';
    note.innerHTML = 'You can close this tab. <a href="' + url.replace(/"/g, '%22') + '">Open again</a>';
  }, 1800);
})();
</script>
